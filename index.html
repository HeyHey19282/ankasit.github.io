<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topluluk Bağlantıları</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        img.profile {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* Logoyu yuvarlak yapar. Kare kalsın isterseniz bu satırı silebilirsiniz */
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #1a1a1a; font-size: 26px; margin-bottom: 5px; }
        p { color: #666; font-size: 16px; margin-bottom: 30px; }
        
        a.link-btn {
            display: block;
            background-color: #ffffff;
            color: #1a1a1a;
            text-decoration: none;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        a.link-btn:hover {
            background-color: #1a1a1a;
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- LOGO KISMI -->
        <img src="1791147713635.jpg.png" alt="Topluluk Logosu" class="profile">
        
        <!-- BAŞLIK VE AÇIKLAMA KISMI -->
        <h1>Savunma Sanayi Ve İleri Teknolojiler</h1>
        <p>-------------------------------------</p>

        <!-- LİNKLER KISMI -->

        <a href="https://www.instagram.com/duzceankasit/" target="_blank" class="link-btn">Instagram Hesabımız</a>
        
        <a href="https://www.linkedin.com/in/anka-sit-toplulu%C4%9Fu/" target="_blank" class="link-btn">Linkedin Hesabımız</a>
        
        <a href="https://forms.gle/62dk1bZWqUvJqnJy5" target="_blank" class="link-btn">Departman Başvuru Formumuz</a>

    </div>
</body>
</html>
